# Locked down for machine -> phone command execution (cb clipboard reads).
# Tailnet only, key only, no forwarding, no pty-from-key (see authorized_keys
# "restrict"). Tailscale IP is stable per node; update it if the node is
# recreated.
Port 8022
ListenAddress 127.0.0.1
ListenAddress 100.114.32.4

PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitRootLogin no
PermitUserRC no

MaxAuthTries 3
LoginGraceTime 20
ClientAliveInterval 60
ClientAliveCountMax 3

AllowAgentForwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
X11Forwarding no
PermitTunnel no
